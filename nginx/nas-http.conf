# /etc/nginx/conf.d/nas-http.conf
# http 블록 수준 설정 (conf.d 파일은 http 블록 안에 포함된다)

# 로그인 시도 횟수 제한: IP당 분당 10회
limit_req_zone $binary_remote_addr zone=nas_login:10m rate=10r/m;

# WebSocket 연결 헤더 (기존 설정의 같은 이름 변수와 충돌하지 않도록 nas_ 접두사)
map $http_upgrade $nas_connection_upgrade {
    default upgrade;
    ''      close;
}

# 공유 링크(익명 접근) 요청 횟수 제한: 링크 해시 추측 방지
limit_req_zone $binary_remote_addr zone=nas_public:10m rate=30r/s;
