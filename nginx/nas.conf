# /etc/nginx/sites-available/nas
# nas.example.com 은 실제 도메인으로 바꾼다 (server_name, 인증서 경로 2곳).

server {
    listen 80;
    server_name nas.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nas.example.com;

    ssl_certificate     /etc/letsencrypt/live/nas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nas.example.com/privkey.pem;

    client_max_body_size 0;          # 업로드 용량 제한 없음
    proxy_request_buffering off;     # 대용량 업로드를 디스크에 임시 저장하지 않고 바로 전달
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # ---- 인증 확인 (Nginx 내부 전용, 외부에서 직접 호출하면 404) ----
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8086/_auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
    }

    # ---- 게이트웨이 (로그인, 로그아웃, 암호화 보관함, 정적 파일) ----
    location = /_gw/login {
        limit_req zone=nas_login_post burst=5 nodelay;
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /_gw/ {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 공유 링크: 인증 없이 Quantum으로 ----
    # Quantum은 X-Username 헤더를 무조건 믿으므로 반드시 빈 값으로 덮어쓴다.
    location /public/ {
        limit_req zone=nas_public burst=60 nodelay;

        proxy_pass http://127.0.0.1:8085;
        proxy_set_header X-Username        "";
        proxy_set_header Authorization     "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # 공유 페이지에도 같은 화면 테마 (계정 메뉴는 넣지 않음)
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/_gw/static/quantum.css"><script src="/_gw/static/lucide-icons.js" defer></script></head>';
        sub_filter_once on;
    }

    # 외부에 노출하지 않을 Quantum 경로 (WebDAV는 설정으로도 끔, swagger는 api 권한이 없으면 막히지만 한 번 더 차단)
    location /dav/    { return 404; }
    location /swagger { return 404; }

    # Quantum은 X-Username, X-Forwarded-Host, X-Forwarded-Proto를 그대로 믿는다.
    # 아래 모든 프록시 location에서 이 헤더들을 Nginx 값으로 덮어쓴다.

    # ---- Quantum (인증 필요) ----
    location / {
        # 게이트웨이가 모르는 토큰으로 다른 사용자처럼 동작하지 못하게 한다 (브라우저는 쿠키로만 인증)
        if ($arg_auth) { return 403; }

        auth_request /_auth;
        auth_request_set $nas_user $upstream_http_x_nas_user;
        error_page 401 = @login;
        error_page 403 = @reset;

        proxy_pass http://127.0.0.1:8085;
        proxy_set_header X-Username        $nas_user;
        proxy_set_header Authorization     "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $nas_connection_upgrade;

        # 화면 테마 + 계정 메뉴 주입 (압축된 응답에는 sub_filter가 동작하지 않으므로 압축을 끈다)
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/_gw/static/quantum.css"><script src="/_gw/static/lucide-icons.js" defer></script><script src="/_gw/static/overlay.js" defer></script></head>';
        sub_filter_once on;
    }

    location @login { return 302 /_gw/login; }
    location @reset { return 302 /_gw/reset; }
}
