<!doctype html>
<!--
  기본 로그인 페이지. 직접 디자인한 페이지로 바꾸려면 config/custom/login.html 에 두면 된다.
  지켜야 할 규칙:
    - <form method="post" action="/_gw/login"> 로 username, password 필드를 보낸다.
    - 로그인 실패 시 /_gw/login?error=1 로 돌아온다.
    - 인라인 스크립트/스타일은 CSP로 막혀 있으므로 /_gw/static/ 아래 파일로 분리한다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>로그인 · My NAS</title>
  <link rel="stylesheet" href="/_gw/static/gw.css">
  <script src="/_gw/static/login.js" defer></script>
</head>
<body class="gw-center">
  <form class="gw-card" method="post" action="/_gw/login">
    <div class="gw-brand">
      <div class="gw-logo" aria-hidden="true">
        <svg class="lucide lucide-hard-drive" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M10 16h.01" /><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z" /><path d="M21.946 12.013H2.054" /><path d="M6 16h.01" /></svg>
      </div>
    </div>

    <p id="gw-error" class="gw-alert" role="alert" hidden>아이디 또는 비밀번호 오류</p>

    <label class="gw-field">
      <input name="username" placeholder="아이디" aria-label="아이디" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label class="gw-field">
      <input name="password" placeholder="비밀번호" aria-label="비밀번호" type="password" autocomplete="current-password" required>
    </label>
    <button class="gw-btn" type="submit">로그인</button>
    <a id="gw-back" class="gw-link" href="/" hidden>돌아가기</a>
  </form>
</body>
</html>
