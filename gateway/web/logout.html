<!doctype html>
<!-- Quantum 화면의 로그아웃 버튼(logoutRedirectUrl)이 이 페이지로 온다. 로그아웃은 POST로만 처리한다. -->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그아웃</title>
  <link rel="stylesheet" href="/_gw/static/gw.css">
</head>
<body class="gw-center">
  <form class="gw-card" method="post" action="/_gw/logout">
    <h1>로그아웃</h1>
    <p class="gw-note">로그아웃하면 이 네트워크에 지정된 계정으로 돌아가거나, 지정된 계정이 없으면 로그인 화면으로 이동합니다.</p>
    <button type="submit">로그아웃</button>
    <a class="gw-link" href="/">취소</a>
  </form>
</body>
</html>
